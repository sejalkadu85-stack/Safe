version: "3.9"

services:

  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: safeher_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-safeher}
      POSTGRES_USER: ${DB_USER:-safeher_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-safeher_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-safeher_user} -d ${DB_NAME:-safeher}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (Django Channels + Celery broker)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safeher_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Django / Daphne ASGI App
  # ─────────────────────────────────────────────
  web:
    build: .
    container_name: safeher_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_helplines &&
             python manage.py seed_quick_templates &&
             daphne -b 0.0.0.0 -p 8000 women_safety.asgi:application"
    volumes:
      - .:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-safeher}
      - DB_USER=${DB_USER:-safeher_user}
      - DB_PASSWORD=${DB_PASSWORD:-safeher_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - FCM_SERVER_KEY=${FCM_SERVER_KEY:-}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy + Static/Media Files
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: safeher_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
